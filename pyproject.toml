[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineering-toolkit"
version = "0.2.0"
description = "Context window optimization library for LLM applications — compression, prioritization, benchmarking, and model-specific profiles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jordan Stilb", email = "jstilb@example.com"},
]
keywords = [
    "llm", "context-engineering", "context-window", "compression",
    "token-counting", "rag", "retrieval-augmented-generation",
    "prompt-engineering", "ai", "anthropic", "openai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tiktoken>=0.5.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
notebooks = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.7",
    "nbconvert>=7.0",
]

[project.urls]
Homepage = "https://github.com/jstilb/context-engineering-toolkit"
Repository = "https://github.com/jstilb/context-engineering-toolkit"
"Bug Tracker" = "https://github.com/jstilb/context-engineering-toolkit/issues"

[project.scripts]
ctx-toolkit = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
